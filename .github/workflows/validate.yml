name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Backend-generated publication PRs may carry an explicit staged version.
      # Main only tolerates it while the opt-in post-merge handoff is enabled;
      # publish.yml must convert it before releasing or reconciling.
      REGISTRY_ALLOW_STAGED: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'registry/publication/')) || (github.event_name == 'push' && vars.ENABLE_REGISTRY_PUBLISH == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Rebuild generated index before validation
        run: npm run index
      - name: Validate schemas and references
        run: npm run validate
      - name: Require committed generated index unless staged handoff is present
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_STAGED: ${{ env.REGISTRY_ALLOW_STAGED }}
          PUBLICATION_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'registry/publication/') }}
        run: |
          set -euo pipefail
          if git diff --quiet -- registry/index.json; then
            exit 0
          fi
          staged_id="$(find registry/projects -type f -path '*/resources/*/versions/*.json' -print0 | xargs -0 -r jq -r 'select(.packaging.mode == "staged") | .id' | head -n 1)"
          if { [ "$PUBLICATION_PR" = "true" ] || { [ "$EVENT_NAME" = "push" ] && [ "$ALLOW_STAGED" = "true" ]; }; }; then
            if [ -n "$staged_id" ]; then
              echo "Index drift is deferred to the post-merge staged packaging handoff ($staged_id)."
            else
              echo "Index drift is deferred to the post-merge publication handoff."
            fi
            exit 0
          fi
          git diff --exit-code -- registry/index.json
      - name: Rebuild approved packages without executing upstream
        run: npm run package:dry-run -- --live --allow-staged --output .generated/packages
