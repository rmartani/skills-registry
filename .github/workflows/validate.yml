name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Validate schemas and references
        run: npm run validate
      - name: Rebuild generated index
        run: npm run index
      - name: Require committed generated index
        run: git diff --exit-code -- registry/index.json
      - name: Rebuild approved packages without executing upstream
        run: npm run package:dry-run -- --live --output .generated/packages
